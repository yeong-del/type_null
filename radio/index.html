<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>연합해군 전술 무전망</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   전술 무전망 — 진영마다 단말기 외장·LCD 백라이트·파형이 바뀝니다
   ========================================================== */
:root{
  --digit:'Azeret Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
/* 제3전대 스콜 — 그래파이트 외장, 일렉트릭 블루 LCD */
body[data-unit="skoll"]{
  --shell:#0d1114; --shell2:#161c21; --edge:#232c33; --ink:#dce6eb; --mute:#6f7f8a;
  --lcd:#021619; --glow:#00E5FF; --glow-soft:rgba(0,229,255,.16); --alt:#FF7A00;
  --tex:radial-gradient(circle at 1px 1px,rgba(255,255,255,.035) 1px,transparent 0) 0 0/4px 4px;
}
/* 제1전대 칼름 — 검은 제복과 은사 자수, 무풍대처럼 고요한 화면 */
body[data-unit="calm"]{
  --shell:#09090b; --shell2:#111114; --edge:#2a2a30; --ink:#e4e6ea; --mute:#7a7c84;
  --lcd:#0c0d10; --glow:#D3D8E0; --glow-soft:rgba(211,216,224,.10); --alt:#D3D8E0;
  --tex:repeating-linear-gradient(135deg,rgba(211,216,224,.035) 0 1px,transparent 1px 9px);
}
/* 제2전대 템페스트 — 전투 레이더 인광 */
body[data-unit="tempest"]{
  --shell:#0b100e; --shell2:#121a16; --edge:#22302a; --ink:#d9e8df; --mute:#6c8276;
  --lcd:#03110a; --glow:#6CFFA8; --glow-soft:rgba(108,255,168,.13); --alt:#6CFFA8;
  --tex:repeating-linear-gradient(100deg,rgba(255,255,255,.025) 0 1px,transparent 1px 7px);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--shell);background-image:var(--tex);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background-color .6s var(--ease),color .6s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;height:100%}

/* ---------- 진영 선택 ---------- */
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:10px 12px 0}
.unit{padding:8px 4px 9px;border-radius:10px 10px 4px 4px;text-align:center;color:var(--mute);
  background:transparent;border:1px solid transparent;transition:all .3s var(--ease)}
.unit strong{display:block;font-size:14px;font-weight:600;letter-spacing:.02em}
.unit span{display:block;font-size:10.5px;margin-top:1px;opacity:.8}
.unit[aria-pressed="true"]{color:var(--ink);background:var(--shell2);border-color:var(--edge);border-bottom-color:var(--shell2)}
.unit[aria-pressed="true"] strong{color:var(--glow)}

/* ---------- 단말기 본체 ---------- */
.device{margin:0 12px;padding:14px;background:var(--shell2);border:1px solid var(--edge);border-radius:4px 4px 18px 18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 14px 30px -18px #000}
.screen{position:relative;background:var(--lcd);border-radius:8px;padding:12px 14px 10px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 6px 18px rgba(0,0,0,.55),0 0 24px var(--glow-soft)}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 35%),repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--glow);font-family:var(--digit);font-size:11px;font-weight:500}
.row .dim{opacity:.55}
.freq{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px;color:var(--glow)}
.freq b{font-family:var(--digit);font-weight:300;font-size:46px;line-height:1;letter-spacing:-.02em;text-shadow:0 0 14px var(--glow-soft),0 0 2px var(--glow)}
.freq small{font-family:var(--digit);font-size:12px;opacity:.6}
.chline{display:flex;justify-content:space-between;align-items:baseline;color:var(--glow);font-size:13px}
.chline .who{opacity:.65;font-size:11.5px}
canvas{display:block;width:100%;height:46px;margin-top:8px}
.state{margin-top:4px;font-size:11.5px;color:var(--glow);min-height:16px}
.state.err{color:#ff7d7d}
.screen.shift{animation:shift .55s var(--ease)}
@keyframes shift{0%{filter:brightness(1)}20%{filter:brightness(2.4) blur(1px)}45%{filter:brightness(.15)}100%{filter:brightness(1)}}

.bars{display:flex;gap:2px;align-items:flex-end;height:11px}
.bars i{width:3px;background:currentColor;opacity:.18;display:block}
.bars i:nth-child(1){height:3px}.bars i:nth-child(2){height:5px}.bars i:nth-child(3){height:7px}.bars i:nth-child(4){height:9px}.bars i:nth-child(5){height:11px}
.bars i.on{opacity:1}
.batt{display:inline-flex;align-items:center;gap:1px}
.batt i{width:16px;height:8px;border:1px solid currentColor;border-radius:1px;padding:1px;display:block}
.batt i::after{content:"";display:block;height:100%;width:var(--lv,80%);background:currentColor}
.batt::after{content:"";width:2px;height:4px;background:currentColor}

/* 채널 버튼 — 단말기의 물리 키 */
.keys{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.key{flex:0 0 auto;padding:8px 12px;border-radius:7px;font-size:12.5px;color:var(--mute);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.15));border:1px solid var(--edge);
  box-shadow:0 2px 0 rgba(0,0,0,.5);transition:transform .08s,color .2s}
.key:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.key[aria-pressed="true"]{color:var(--glow);border-color:color-mix(in srgb,var(--glow) 45%,var(--edge))}
.key[aria-pressed="true"]::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--glow);margin-right:6px;vertical-align:2px;box-shadow:0 0 6px var(--glow)}
.key.alt[aria-pressed="true"]{color:var(--alt)}
.key.alt[aria-pressed="true"]::before{background:var(--alt);box-shadow:0 0 6px var(--alt)}

/* ---------- 교신 기록 ---------- */
#log{flex:1;overflow-y:auto;padding:18px 16px 12px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.open{align-self:center;font-size:11.5px;color:var(--mute);padding:4px 10px;border:1px dashed var(--edge);border-radius:20px}
.empty{color:var(--mute);font-size:13px;line-height:1.7;text-align:center;margin:auto 0;padding:0 20px}
.m{display:grid;grid-template-columns:40px 1fr;gap:3px 11px;max-width:94%}
.m .av{grid-row:1/3;width:40px;height:40px;border-radius:11px;overflow:hidden;background:var(--shell2);border:1px solid var(--edge);position:relative}
.m .av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block;filter:saturate(.9) contrast(1.05)}
.m .av::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);pointer-events:none}
.m .av.none{display:grid;place-items:center;color:var(--mute);font-family:var(--digit);font-size:13px}
.m .name{font-size:12.5px;font-weight:600;color:var(--glow);grid-column:2;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.m .name em{font-style:normal;font-weight:400;color:var(--mute);font-size:11.5px}
.m .time{font-family:var(--digit);font-size:10px;color:var(--mute);font-weight:400;margin-left:auto}
.m .say{grid-column:2;font-size:14.5px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.m.alt .name{color:var(--alt)}
.m.alt .av{border-color:color-mix(in srgb,var(--alt) 50%,var(--edge))}
.m.me{align-self:flex-end;grid-template-columns:1fr;max-width:86%}
.m.me .name{grid-column:1;justify-content:flex-end;color:var(--ink)}
.m.me .name .time{margin-left:0;order:-1}
.m.me .say{grid-column:1}
.m.me .av{display:none}

/* 직통 채널 상대 카드 */
.contact{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;padding:12px;border:1px solid var(--edge);border-radius:14px;background:var(--shell2)}
.contact .pic{width:76px;height:96px;border-radius:9px;overflow:hidden;position:relative;background:var(--shell)}
.contact .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block}
.contact .pic::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 -30px 30px -20px rgba(0,0,0,.6)}
.contact b{display:block;font-size:17px;font-weight:600;color:var(--ink)}
.contact .r{font-size:12px;color:var(--glow);margin:2px 0 6px}
.contact .s{font-size:11.5px;color:var(--mute)}
.contact q{display:block;font-size:13px;color:var(--ink);opacity:.85;margin-top:8px;line-height:1.55;quotes:"「" "」"}
.contact.alt .r{color:var(--alt)}
.key img{width:18px;height:18px;border-radius:5px;object-fit:cover;object-position:50% 10%;vertical-align:-4px;margin-right:6px;opacity:.75}
.key[aria-pressed="true"] img{opacity:1}
.key[aria-pressed="true"]:has(img)::before{display:none}
.m.me .say{background:color-mix(in srgb,var(--glow) 9%,transparent);border:1px solid color-mix(in srgb,var(--glow) 22%,transparent);
  padding:8px 12px;border-radius:14px 14px 4px 14px;text-align:left}
/* 기록에 남는 출처 불명 신호 흔적 */
.trace{align-self:center;display:flex;align-items:center;gap:8px;font-size:11.5px;color:#ff8f9b;padding:6px 12px;
  border:1px solid rgba(255,92,110,.35);border-radius:20px;background:rgba(255,92,110,.06)}
.trace::before{content:"";width:6px;height:6px;border-radius:50%;background:#FF5C6E;box-shadow:0 0 8px #FF5C6E;animation:pulse 1.6s infinite}
.trace span{font-family:var(--digit);font-size:10px;opacity:.7}
@keyframes pulse{50%{opacity:.25}}

/* 출처 불명 신호 창 */
.ix{position:fixed;left:50%;top:18%;width:min(340px,calc(100% - 32px));transform:translateX(-50%);z-index:70;
  background:#120708;border:1px solid #5a1f26;border-radius:6px;color:#f3d6d9;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 24px 60px -10px rgba(0,0,0,.9),0 0 40px rgba(255,92,110,.18);
  font-family:var(--sans);overflow:hidden;animation:ixIn .5s steps(6,end)}
.ix[hidden]{display:none}
@keyframes ixIn{0%{clip-path:inset(48% 0 48% 0);filter:brightness(3)}60%{clip-path:inset(0 0 0 0);filter:brightness(1.6)}100%{filter:none}}
.ix.glitch{animation:ixShake .18s 3}
@keyframes ixShake{0%{transform:translateX(-50%)}33%{transform:translateX(calc(-50% + 3px)) skewX(-2deg)}66%{transform:translateX(calc(-50% - 2px))}}
.ix-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(90deg,#3a0d13,#1c0709);border-bottom:1px solid #5a1f26;font-size:12px;cursor:grab;touch-action:none;user-select:none}
.ix-bar b{font-weight:600;color:#FF5C6E;flex:1}
.ix-bar .rec{width:7px;height:7px;border-radius:50%;background:#FF5C6E;box-shadow:0 0 8px #FF5C6E;animation:pulse 1s infinite}
.ix-x{width:26px;height:26px;border-radius:4px;color:#f3d6d9;opacity:.7;font-size:16px;line-height:1}
.ix-x:hover{opacity:1;background:rgba(255,255,255,.06)}
.ix-body{padding:12px 14px 14px;position:relative}
.ix-body::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.ix-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11px;color:#a77a80;margin-bottom:10px}
.ix-meta dd{font-family:var(--digit);color:#ffb3bc}
.ix canvas{height:34px;margin:0 0 10px}
.ix-text{font-family:var(--digit);font-size:13.5px;line-height:1.75;color:#ffd5da;min-height:48px;word-break:keep-all;overflow-wrap:anywhere;text-shadow:0 0 6px rgba(255,92,110,.35)}
.ix-text .tag{color:#a77a80}
.ix-foot{font-size:11px;color:#a77a80;margin-top:10px}
.f textarea{width:100%;background:var(--shell);border:1px solid var(--edge);color:var(--ink);padding:10px 12px;font:14px/1.6 var(--sans);border-radius:10px;outline:none;resize:vertical;min-height:110px;max-height:none}
.count{text-align:right;font-family:var(--digit);font-size:10.5px;color:var(--mute);margin-top:4px}
.tag{color:var(--mute);font-size:12px}
.caret{display:inline-block;width:2px;height:15px;background:var(--glow);vertical-align:-3px;margin-left:1px;animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* ---------- 송신부 ---------- */
.tx{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--edge);background:color-mix(in srgb,var(--shell) 85%,#000)}
.txtop{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mute);margin:0 4px 7px}
.txtop button{color:var(--mute);font-size:11.5px;text-decoration:underline;text-underline-offset:3px}
.txtop b{color:var(--ink);font-weight:500}
.field{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--shell2);border:1px solid var(--edge);color:var(--ink);font:15px/1.5 var(--sans);
  padding:11px 14px;border-radius:22px;max-height:130px;outline:none;transition:border-color .2s}
textarea:focus{border-color:color-mix(in srgb,var(--glow) 55%,var(--edge))}
textarea::placeholder{color:var(--mute)}
.ptt{flex:0 0 auto;width:50px;height:46px;border-radius:23px;background:var(--glow);color:var(--lcd);font-weight:600;font-size:13px;
  box-shadow:0 0 0 0 var(--glow-soft);transition:transform .1s,box-shadow .3s,opacity .2s}
.ptt:active{transform:scale(.94)}
.ptt.live{box-shadow:0 0 0 8px var(--glow-soft)}
.ptt:disabled{opacity:.45}

/* ---------- 설정 ---------- */
dialog{margin:auto auto 0;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border:0;border-top:1px solid var(--edge);background:var(--shell2);color:var(--ink);
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:16px;font-weight:600;margin-bottom:4px}
dialog p{font-size:12.5px;color:var(--mute);margin-bottom:16px;line-height:1.6}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px}
.f input{width:100%;background:var(--shell);border:1px solid var(--edge);color:var(--ink);padding:10px 12px;font:14px var(--sans);border-radius:10px;outline:none}
.sw{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:14px;border-top:1px solid var(--edge)}
.sw input{accent-color:var(--glow);width:20px;height:20px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts button{padding:11px;border:1px solid var(--edge);font-size:13px;border-radius:10px}
.acts .go{grid-column:1/-1;background:var(--glow);color:var(--lcd);border-color:var(--glow);font-weight:600}
.acts .warn{color:#ff8a8a}
.note{font-size:11.5px;color:var(--mute);margin-top:12px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-unit="skoll">
<div class="wrap">

  <nav class="units" id="units" aria-label="진영 선택"></nav>

  <section class="device">
    <div class="screen" id="screen">
      <div class="row">
        <span id="unitLabel">연합해군 제3전대</span>
        <span style="display:flex;gap:10px;align-items:center">
          <span id="clock" class="dim">--:--</span>
          <span class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="batt"><i id="batt"></i></span>
        </span>
      </div>
      <div class="freq"><b id="freq">141.200</b><small>MHz</small></div>
      <div class="chline"><span id="chName">전 대원</span><span class="who" id="chWho"></span></div>
      <canvas id="scope" aria-hidden="true"></canvas>
      <div class="state" id="state" role="status">대기 중</div>
    </div>
    <div class="keys" id="keys"></div>
  </section>

  <main id="log" aria-live="polite"></main>

  <footer class="tx">
    <div class="txtop"><span>내 콜사인 <b id="cs">미설정</b></span><button id="openSet">무전기 설정</button></div>
    <div class="field">
      <textarea id="input" rows="1" placeholder="무전 내용을 입력하세요"></textarea>
      <button class="ptt" id="ptt" aria-label="송신">송신</button>
    </div>
  </footer>
</div>

<dialog id="set">
  <h2>무전기 설정</h2>
  <p>콜사인은 무전을 받는 쪽에서 당신을 부르는 이름입니다.</p>
  <div class="f"><label for="sCs">콜사인</label><input id="sCs" maxlength="20" placeholder="예) 블루 식스"></div>
  <div class="f"><label for="sProf">내 프로필</label><textarea id="sProf" maxlength="300" placeholder="무전 상대가 알고 있을 당신의 정보를 적어 주세요. 소속, 외모, 성격, 지금 맡은 일 같은 것들이요."></textarea><div class="count" id="sCount">0 / 300</div></div>
  <div class="f"><label for="sPass">접속 암호</label><input id="sPass" type="password" placeholder="받은 암호를 입력하세요"></div>
  <div class="sw"><label for="sSnd">무전 효과음</label><input type="checkbox" id="sSnd"></div>
  <div class="acts">
    <button class="go" id="sSave">설정 저장</button>
    <button id="sExport">이 채널 기록 받기</button>
    <button class="warn" id="sClear">이 채널 기록 지우기</button>
  </div>
  <div class="note" id="sNote"></div>
</dialog>

<section class="ix" id="ix" hidden role="alertdialog" aria-labelledby="ixTitle">
  <div class="ix-bar" id="ixBar"><span class="rec"></span><b id="ixTitle">출처 불명 신호</b><button class="ix-x" id="ixClose" aria-label="창 닫기">✕</button></div>
  <div class="ix-body">
    <dl class="ix-meta"><dt>주파수</dt><dd id="ixFreq">—</dd><dt>발신지</dt><dd id="ixFrom">역탐지 실패</dd><dt>수신</dt><dd id="ixTime">—</dd></dl>
    <canvas id="ixScope" aria-hidden="true"></canvas>
    <div class="ix-text" id="ixText"></div>
    <div class="ix-foot">연합해군 등록 주파수가 아닙니다.</div>
  </div>
</section>

<script>
/* ==========================================================
   Worker 배포 후 주소만 넣으면 실제 응답으로 바뀝니다.
   비워두면 데모 모드(사이트 대표 대사)로 동작합니다.
   ========================================================== */
const WORKER_URL = "https://calm-silence-d9a8skoll-radio.hongraon1342.workers.dev";

/* 사이트 인사기록에서 가져온 표시용 정보 · 이미지는 사이트의 img 폴더를 그대로 씁니다 */
const IMG_BASE = "https://yeong-del.github.io/type_null/img/";

let ac=null;
const A=()=>{ if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} return ac };
function hiss(dur,vol){
  if(!S.sound) return; const a=A(); if(!a) return; const snd=UNITS[unit].sound;
  const b=a.createBuffer(1,Math.max(1,a.sampleRate*dur),a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  f.type="bandpass"; f.frequency.value=snd.band; f.Q.value=.6; g.gain.value=vol??snd.noise;
  s.buffer=b; s.connect(f).connect(g).connect(a.destination); s.start();
}
function tone(fq,dur,vol=.035,at=0,type="square"){
  if(!S.sound) return; const a=A(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+at;
  o.type=type; o.frequency.value=fq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
}
const sfx={
  tx(){ hiss(.1); tone(1400,.05,.03,.04) },
  rx(){ hiss(UNITS[unit].sound.tail) },
  roger(){ if(unit==="calm"){ tone(660,.12,.025,0,"sine") } else { tone(1250,.05); tone(950,.06,.035,.07) } },
  tune(){ hiss(.18,.06) },
  ghost(){ hiss(.7,.13); tone(520,.35,.025,.12,"sawtooth"); tone(347,.4,.02,.4,"sawtooth") },
  err(){ hiss(.5,.14) },
};

/* ==========================================================
   LCD 파형
   ========================================================== */
const cv=$("scope"), cx=cv.getContext("2d");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let phase=0;
function fit(){ const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr; cx.setTransform(dpr,0,0,dpr,0,0) }
function draw(){
  const w=cv.clientWidth, h=cv.clientHeight, sc=UNITS[unit].scope;
  const glow=getComputedStyle(document.body).getPropertyValue("--glow").trim();
  cx.clearRect(0,0,w,h);
  // 눈금
  cx.globalAlpha=.14; cx.strokeStyle=glow; cx.lineWidth=1;
  for(let x=0;x<w;x+=w/12){ cx.beginPath(); cx.moveTo(x+.5,0); cx.lineTo(x+.5,h); cx.stroke() }
  cx.beginPath(); cx.moveTo(0,h/2+.5); cx.lineTo(w,h/2+.5); cx.stroke();
  // 파형
  const lv=Math.max(rxLevel,txLevel), amp=(.04+lv*sc.amp)*h/2;
  cx.globalAlpha=1; cx.lineWidth=1.6; cx.shadowColor=glow; cx.shadowBlur=8; cx.beginPath();
  for(let x=0;x<=w;x+=2){
    const t=x/w*Math.PI*2;
    let y=Math.sin(t*3+phase)*.6+Math.sin(t*7.3-phase*1.7)*.3;
    y+=(Math.random()*2-1)*(sc.jitter+lv*.4);
    y*=amp*(.6+.4*Math.sin(t*.5+phase*.3));
    x?cx.lineTo(x,h/2+y):cx.moveTo(x,h/2+y);
  }
  cx.strokeStyle=glow; cx.stroke(); cx.shadowBlur=0;
  phase+=.05*sc.speed*(1+lv*2);
  rxLevel*=.97; txLevel*=.9;
  if(!reduce) requestAnimationFrame(draw);
}

function chatHistory(){
  const out=[];
  (logs[key()]||[]).filter(e=>e.kind!=="ghost").slice(-24).forEach(e=>{
    const role=e.kind==="me"?"user":"assistant", c=e.kind==="me"?`[${e.who}] ${e.text}`:`${e.who}|${e.text}`;
    if(out.length&&out[out.length-1].role===role) out[out.length-1].content+="\n"+c; else out.push({role,content:c});
  });
  while(out.length&&out[0].role!=="user") out.shift();

function parse(text){
  const res=[], ok=ch.members;
  text.split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^([^|]{1,20})\|\s*(.+)$/);
    if(m&&ok.includes(m[1].trim())) res.push({who:m[1].trim(),text:m[2].trim()});
    else if(res.length) res[res.length-1].text+=" "+l;
    else res.push({who:ok[0],text:l});
  });
  return res;
}

    await wait(800+Math.random()*900);
    const u=UNITS[unit], pool=[...ch.members].sort(()=>Math.random()-.5), n=ch.members.length>1?1+Math.floor(Math.random()*2):1;
    // 데모: 말투가 어긋나지 않게 사이트의 대표 대사로만 응답
    return pool.slice(0,n).map(who=>({who,text:PEOPLE[u.img[who]].q}));
  }
  const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({unit,channel:ch.id,callsign:S.callsign,profile:S.profile,passcode:S.passcode,history:chatHistory()})});
  if(r.status===401) throw new Error("auth");
  if(r.status===429) throw new Error("limit");
  if(!r.ok) throw new Error("net");
  return parse((await r.json()).text||"");
}
function typeIn(node,text){
  return new Promise(done=>{
    const el=node.querySelector(".say"), caret=document.createElement("span"); caret.className="caret";
    const G="▒░█▓"; let i=0;
    if(reduce){ fill(el,text); return done() }
    (function step(){
      i+=1+(Math.random()<.2?1:0);
      let s=text.slice(0,i); if(i<text.length&&Math.random()<.05) s+=G[Math.floor(Math.random()*G.length)];
      fill(el,s); el.appendChild(caret); rxLevel=Math.min(1,rxLevel+.25);
      $("log").scrollTop=$("log").scrollHeight;
      if(i<text.length) setTimeout(step,18+Math.random()*34); else { fill(el,text); done() }
    })();
  });
}
async function send(){
  const text=$("input").value.trim(); if(!text||busy) return;
  if(!S.callsign){ openSet(); return }
  busy=true; $("ptt").disabled=true; $("ptt").classList.add("live");
  $("input").value=""; grow();
  const emp=$("log").querySelector(".empty"); if(emp) emp.remove();

  sfx.tx(); txLevel=1; state("송신 중");
  const me={kind:"me",who:S.callsign,text,t:Date.now()}; push(me);
  const b=bubble(me); fill(b.querySelector(".say"),text); $("log").appendChild(b); $("log").scrollTop=$("log").scrollHeight;
  await wait(300); state("응답 대기 중");
  try{
    const rs=await ask();
    for(const r of rs){
      sfx.rx(); sig=3+Math.floor(Math.random()*3); drawBars(); state(`${r.who} 수신 중`);
      const e={kind:"crew",who:r.who,text:r.text,t:Date.now()}, n=bubble(e); $("log").appendChild(n);
      await typeIn(n,r.text); push(e); sfx.roger(); await wait(380);
    }
    state("대기 중");
  }catch(err){
    sfx.err(); sig=1; drawBars();
    state({auth:"접속 암호가 맞지 않습니다. 설정에서 다시 입력하세요.",limit:"오늘 송신 가능 횟수를 모두 썼습니다.",net:"신호가 끊겼습니다. 잠시 후 다시 송신하세요."}[err.message]||"신호가 끊겼습니다.",true);
  }
  busy=false; $("ptt").disabled=false; $("ptt").classList.remove("live"); schedule();
}

/* ==========================================================
   입력 · 설정
   ========================================================== */
function grow(){ const t=$("input"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,130)+"px" }
$("input").addEventListener("input",grow);
$("input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send() } });
$("ptt").onclick=send;

const dlg=$("set");
function openSet(){
  $("sCs").value=S.callsign; $("sPass").value=S.passcode; $("sSnd").checked=S.sound; $("sProf").value=S.profile||""; countProf();
  $("sNote").textContent=WORKER_URL?"":"지금은 데모 모드입니다. Worker 주소를 넣으면 대원들이 실제로 대답합니다.";
  dlg.showModal();
}
$("openSet").onclick=openSet;
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close() });
$("sSave").onclick=()=>{
  Object.assign(S,{callsign:$("sCs").value.trim(),passcode:$("sPass").value,sound:$("sSnd").checked,profile:$("sProf").value.trim().slice(0,300)});
  save(); $("cs").textContent=S.callsign||"미설정"; dlg.close();
};
$("sClear").onclick=()=>{ if(confirm(`${ch.name} 채널의 교신 기록을 지울까요?`)){ logs[key()]=[]; store.set("tacnet_logs",logs); renderLog(); dlg.close() } };
$("sExport").onclick=()=>{
  const u=UNITS[unit], lines=(logs[key()]||[]).map(e=>`[${hhmm(e.t)}] ${e.kind==="ghost"?"출처 불명":e.who}: ${e.text}`).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([`${u.label} / ${ch.name} / ${ch.freq.toFixed(3)} MHz\n\n${lines}`],{type:"text/plain"}));
  a.download=`tacnet_${unit}_${ch.id}.txt`; a.click();
};


/* ==========================================================
   출처 불명 신호 창
   ========================================================== */
const ix=$("ix"), ixCv=$("ixScope"), ixCx=ixCv.getContext("2d");
let ixRun=false, ixLv=0;
function ixDraw(){
  if(ix.hidden){ ixRun=false; return }
  const r=ixCv.getBoundingClientRect(), dpr=devicePixelRatio||1;
  if(ixCv.width!==Math.round(r.width*dpr)){ ixCv.width=r.width*dpr; ixCv.height=r.height*dpr; ixCx.setTransform(dpr,0,0,dpr,0,0) }
  const w=r.width, h=r.height; ixCx.clearRect(0,0,w,h);
  ixCx.strokeStyle="#FF5C6E"; ixCx.lineWidth=1.4; ixCx.shadowColor="#FF5C6E"; ixCx.shadowBlur=6; ixCx.beginPath();
  for(let x=0;x<=w;x+=2){
    const burst=Math.random()<.04?(Math.random()*2-1)*h*.45:0;
    const y=h/2+(Math.random()*2-1)*h*(.06+ixLv*.3)+burst;
    x?ixCx.lineTo(x,y):ixCx.moveTo(x,y);
  }
  ixCx.stroke(); ixLv*=.96;
  if(!reduce) requestAnimationFrame(ixDraw);
}
const mask=str=>str.replace(/\d/g,d=>Math.random()<.45?"█":d);
async function showIntercept(e,fresh){
  $("ixFreq").textContent=e.freq||"█".repeat(3)+".███";
  $("ixTime").textContent=hhmm(e.t);
  $("ixFrom").textContent=["역탐지 실패","좌표 불명","신호 반사 · 추적 불가"][e.t%3];
  ix.hidden=false; ix.classList.remove("glitch"); void ix.offsetWidth; ix.classList.add("glitch");
  if(!ixRun){ ixRun=true; ixDraw() }
  const el=$("ixText"); el.textContent="";
  if(fresh){ sfx.ghost(); sig=1; drawBars(); state("출처 불명 신호 포착",true); rxLevel=1 }
  if(reduce||!fresh){ fill(el,e.text); return }
  const G="▒░█▓#"; let i=0;
  await new Promise(done=>{ (function step(){
    i++; let t=e.text.slice(0,i);
    if(i<e.text.length&&Math.random()<.14) t+=G[Math.floor(Math.random()*G.length)];
    fill(el,t); ixLv=Math.min(1,ixLv+.3);
    if(i<e.text.length&&!ix.hidden) setTimeout(step,45+Math.random()*70); else { fill(el,e.text); done() }
  })() });
  state("대기 중"); drawBars();
}
$("ixClose").onclick=()=>{ ix.hidden=true; schedule() };
/* 창 끌어서 옮기기 */
(function(){
  const bar=$("ixBar"); let sx=0,sy=0,ox=0,oy=0,drag=false;
  bar.addEventListener("pointerdown",e=>{ if(e.target.closest("button")) return; drag=true; bar.setPointerCapture(e.pointerId);
    const r=ix.getBoundingClientRect(); sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top; });
  bar.addEventListener("pointermove",e=>{ if(!drag) return;
    const x=Math.max(8,Math.min(innerWidth-ix.offsetWidth-8,ox+e.clientX-sx)), y=Math.max(8,Math.min(innerHeight-60,oy+e.clientY-sy));
    ix.style.left=x+"px"; ix.style.top=y+"px"; ix.style.transform="none"; });
  bar.addEventListener("pointerup",()=>drag=false);
})();
function intercept(){
  const txt=INTERCEPT_ALL[pickIndex(INTERCEPT_ALL.length,"ix")].replaceAll("{cs}",S.callsign||"거기");
  const f=(100+Math.random()*90).toFixed(3);
  const e={kind:"ghost",who:"",text:txt,t:Date.now(),freq:mask(f)+" MHz"};
  push(e); $("log").appendChild(bubble(e)); $("log").scrollTop=$("log").scrollHeight;
  return showIntercept(e,true);
}

/* ==========================================================
   대원 자동 무전 (30초 안팎)
   ========================================================== */
const recent={};
function pickIndex(n,tag){
  const used=recent[tag]||(recent[tag]=[]); let i, guard=0;
  do{ i=Math.floor(Math.random()*n) }while(used.includes(i)&&guard++<20);
  used.push(i); if(used.length>Math.max(1,Math.floor(n*.6))) used.shift();
  return i;
}
let ambTimer=null;
function schedule(){ clearTimeout(ambTimer); ambTimer=setTimeout(ambient,25000+Math.random()*12000) }
async function ambient(){
  if(busy||document.hidden||!S.callsign||dlg.open||!ix.hidden){ schedule(); return }
  if(Math.random()<.22){ await intercept(); schedule(); return }
  const who=ch.members[Math.floor(Math.random()*ch.members.length)], k=UNITS[unit].img[who];
  const direct=ch.id!=="all", pool=(AMBIENT[k]||[]).filter(x=>!direct||!x.startsWith("@")).map(x=>x.replace(/^@/,""));
  if(!pool.length){ schedule(); return }
  busy=true; $("ptt").disabled=true;
  const text=pool[pickIndex(pool.length,k+(direct?":d":":a"))].replaceAll("{cs}",S.callsign);
  sfx.rx(); sig=3+Math.floor(Math.random()*3); drawBars(); state(`${who} 수신 중`);
  const e={kind:"crew",who,text,t:Date.now()}, n=bubble(e);
  const emp=$("log").querySelector(".empty"); if(emp) emp.remove();
  $("log").appendChild(n); await typeIn(n,text); push(e); sfx.roger(); state("대기 중");
  busy=false; $("ptt").disabled=false; schedule();
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) schedule() });

function countProf(){ $("sCount").textContent=`${$("sProf").value.length} / 300` }
$("sProf").addEventListener("input",countProf);

/* 시작 */
/* 주소에 담긴 암호 읽기: …/radio/?code=암호 로 들어오면 자동 저장 후 주소에서 지움 */
(function(){
  try{
    const u=new URL(location.href), c=u.searchParams.get("code");
    if(c){
      S.passcode=c; save();
      u.searchParams.delete("code");
      window.history.replaceState(null,"",u.pathname+(u.search||"")+u.hash);
    }
  }catch(e){}
})();
document.body.dataset.unit=unit;
ch=UNITS[unit].channels.find(c=>c.id===S.ch[unit])||UNITS[unit].channels[0];
$("cs").textContent=S.callsign||"미설정";
renderUnits(); renderKeys(); renderScreen(); renderLog(); drawBars();
fit(); addEventListener("resize",fit); draw();
if(!S.callsign) setTimeout(openSet,500);
schedule();
</script>
